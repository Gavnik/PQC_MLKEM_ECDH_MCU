# Pico 2 W, ARM Cortex-M33 -- LAYER 1 ONLY variant (NO active WiFi).
#
# WHY THIS EXISTS: for the Layer-1 primitive study we want the SAME environment on every
# board. The RISC-V Hazard3 cannot run WiFi at all (Zephyr's CYW43 driver is M33-only),
# so to keep the cross-board comparison fair we run Layer 1 with networking/radio OFF on
# EVERY board -- including this ARM one, which is perfectly capable of WiFi but has it
# disabled here. A live radio draws power and raises interrupts that would perturb both
# timing and (especially) energy, and would differ from the RISC-V board. Disabling it
# removes that confound: Layer 1 measures the CORE doing crypto, nothing else.
#
# This is an ADDITIVE override conf. It is merged AFTER the auto-applied
# boards/rpi_pico2_rp2350a_m33.conf (the WiFi-on build used for Layer 2), so the =n lines
# below win and switch the radio + net stack off. It does NOT replace or edit that file.
#
# Final measured builds (NON-/w target, so the CYW43 node is not even in the devicetree):
#   flash : -DEXTRA_CONF_FILE="boards/rpi_pico2_rp2350a_m33_l1only.conf;config/overlay-mpu-on.conf;config/overlay-rp2350-noflashcmd.conf"
#   hybrid: -DEXTRA_CONF_FILE="boards/rpi_pico2_rp2350a_m33_l1only.conf;config/overlay-hyb-arm.conf;config/overlay-rp2350-noflashcmd.conf"
#   asm-off: insert config/overlay-asmoff.conf after the l1only conf.
# (wolfSSL is pulled in by the app CMakeLists.txt via ZEPHYR_EXTRA_MODULES.)

# --- explicitly NO networking / NO radio (override the WiFi-on board conf) ---
CONFIG_WIFI=n
CONFIG_WIFI_AIROC=n
CONFIG_NETWORKING=n
CONFIG_NET_SOCKETS=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_MGMT=n
CONFIG_NET_MGMT_EVENT=n
CONFIG_NET_L2_WIFI_MGMT=n
CONFIG_WIFI_CREDENTIALS=n
CONFIG_WIFI_CREDENTIALS_STATIC=n
CONFIG_NET_CONFIG_SETTINGS=n

# wolfSSL sees no sockets on this build: define WOLFSSL_NO_SOCK on the COMMAND LINE (before
# any wolfssl header is parsed) to avoid "implicit declaration of htons" from wolfio.h.
# Identical to the RISC-V and ESP32 Layer-1-only builds.
CONFIG_COMPILER_OPT="-DWOLFSSL_NO_SOCK -DWOLFSSL_USER_IO -DNO_WOLFSSL_STUB"

# Layer 1 needs only crypto + console; match the other L1-only builds' stack.
CONFIG_MAIN_STACK_SIZE=32768

# ---------- wolfSSL Arm assembly ON (asm=on); overlay-asmoff.conf gives the asm=off control ----------
CONFIG_WOLFCRYPT_ARMASM=y
CONFIG_WOLFCRYPT_ARMASM_THUMB2=y

# ---------- KEEP the USB-CDC console (command/data channel over the Pico's USB port) ----------
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="PQC-Bench"
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
