# Pico 2 W, ARM Cortex-M33 -- WiFi via Infineon CYW43439 (airoc driver).
# NOTE: fetch the WiFi firmware blobs once per workspace:  west blobs fetch hal_infineon
CONFIG_WIFI=y
CONFIG_WIFI_AIROC=y
CONFIG_NET_L2_ETHERNET=y
# static IP for reproducible measurements
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.40"

# WiFi credentials (isolated lab network). Set yours here.
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_STATIC=y
CONFIG_WIFI_CREDENTIALS_STATIC_SSID="YOUR_SSID"
CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD="YOUR_PASSWORD"

# WiFi power-save is disabled at RUNTIME in main.c via the WiFi mgmt API. Power-save
# adds ~ms wake-up latency per handshake and was the root cause of a 2.6 ms/handshake
# inflation in the Raspberry Pi 4 study. (Runtime disable avoids Kconfig symbol-name
# fragility across Zephyr/driver versions.)

# M33 + TLS1.3 + ML-KEM headroom
CONFIG_MAIN_STACK_SIZE=40960

# --- USB-CDC console (Pico's own USB port becomes /dev/ttyACMx) ---
# The console/command channel goes over USB-CDC, not the UART GPIO pins. Requires the
# USB device stack + CDC-ACM, and the matching boards/<board>.overlay (chosen console).
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="PQC-Bench"
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
# wait for the USB CDC DTR (host opens the port) before printing, so we don't lose lines
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# ---------- ARM Thumb-2 assembly for ML-KEM (M33-specific, "best available per core") ----------
# The Cortex-M33 is a Thumb-2 core, and wolfSSL ships hand-optimised Thumb-2 assembly for
# ML-KEM (NTT/basemul) AND for the SHA-3/SHAKE hashing ML-KEM uses internally. Enabling it
# measures the ARM core at its BEST real-world wolfSSL performance -- consistent with the
# Pi, where both libraries use AArch64 assembly. RISC-V Hazard3 and Xtensa LX7 have NO
# ML-KEM assembly in wolfSSL 5.9.2, so they run portable C; this asymmetry is a REPORTED
# methodology choice ("most-optimised build available on each platform"), not a bug.
CONFIG_WOLFCRYPT_ARMASM=y
CONFIG_WOLFCRYPT_ARMASM_THUMB2=y

# ---- WiFi management (needed for net_mgmt(NET_REQUEST_WIFI_CONNECT) to link) ----
# CONFIG_WIFI alone does not pull in the management request handlers; these do.
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_WIFI_MGMT=y
