# PSoC62 (CY8CPROTO-062-4343W, Cortex-M4F / CY8C624ABZI-S2D44) wolfCrypt tuning.
#
# PURPOSE: the asm-ON build of the m4, identical in intent to the m33 asm-ON build. The PSoC6 M4
# is ARMv7E-M (Thumb-2), so the same wolfSSL Cortex-M assembly applies:
#   * Thumb-2 asm for ML-KEM (NTT/basemul), SHA-3/SHAKE, X25519 and SHA-256 (port/arm/thumb2-*,
#     enabled by user_settings.h under CONFIG_WOLFCRYPT_ARMASM + _THUMB2: WOLFSSL_ARMASM,
#     ARMASM_THUMB2, ARMASM_INLINE, ARMASM_NO_NEON, ARMASM_NO_HW_CRYPTO, NO_HASH_RAW);
#   * SP Cortex-M asm for P-256/384/521 (sp_cortexm.c, WOLFSSL_SP_ARM_CORTEX_M_ASM).
#   Verified 2026-11-06 (notes §7-8): ML-KEM-768 decaps -18%, X25519 derive 2.9x vs asm-off.
#   (An earlier note here said ML-KEM had no wolfSSL asm: wrong -- the Thumb-2 asm was simply never
#   enabled before, because our user_settings.h replaced the module's.)
# Self-reports asm=on. The asm-off control is config/overlay-asmoff.conf (asm=off).
# The MPU (CONFIG_ARM_MPU) and stack protection are on by board default in every m4 image.
#
# This conf is NOT auto-merged by board name here; pass it explicitly alongside the L1-only
# overlay, e.g.:
#   -DEXTRA_CONF_FILE="config/overlay-l1only.conf;boards/cy8cproto_062_4343w.conf"
CONFIG_WOLFCRYPT_ARMASM=y
CONFIG_WOLFCRYPT_ARMASM_THUMB2=y
