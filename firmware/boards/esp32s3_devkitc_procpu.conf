# ESP32-S3 DevKitC (Xtensa LX7) -- LAYER 1 + LAYER 2 (TLS over WiFi).
#
# The earlier DRAM overflow (~59 KB) came from the common prj.conf's HUGE heap sizes
# (HEAP_MEM_POOL_SIZE=128K + MALLOC_ARENA=128K = 256 KB) which are Pico-tuned. The ESP32
# internal DRAM region is ~399 KB; with WiFi + lwIP + wolfSSL on top, 256 KB of heap
# doesn't fit. Fix: override with realistic sizes here (this conf is merged AFTER
# prj.conf so these win). wolfSSL ML-KEM needs ~40-50 KB peak heap, not 128 KB.
# No PSRAM needed once the heap is right (avoids Zephyr/ESP-IDF PSRAM symbol mismatch).

CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.41"

CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_STATIC=y
CONFIG_WIFI_CREDENTIALS_STATIC_SSID="YOUR_SSID"
CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD="YOUR_PASSWORD"

# NOTE: WiFi power-save disabled at RUNTIME in main.c.
# mbedTLS stays (WiFi driver force-selects it for WPA2); wolfSSL does all our TLS.
CONFIG_MBEDTLS=y

# --- MEMORY: override the Pico-tuned heap (the real overflow cause) ---
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_MAIN_STACK_SIZE=24576

