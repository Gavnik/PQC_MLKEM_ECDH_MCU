# ESP32-S3 -- LAYER 1 ONLY variant (guaranteed to fit; no WiFi/mbedTLS/lwIP).
# Used by all four measured ESP32 images (radio off, same rationale as the other boards):
#   flash          : -DEXTRA_CONF_FILE="boards/esp32s3_devkitc_procpu_l1only.conf"
#   flash, fast x25519: + ";config/overlay-x25519fast-esp32.conf"
#   hybrid         : + ";config/overlay-iram-esp32.conf"   (run tools/esp32_iram_patch.py first)
#   hybrid, fast   : + ";config/overlay-iram-esp32.conf;config/overlay-x25519fast-esp32.conf"

# --- explicitly NO networking ---
CONFIG_WIFI=n
CONFIG_NETWORKING=n
CONFIG_NET_SOCKETS=n

# wolfSSL sees no sockets (avoid htons implicit-declaration, as on the RISC-V build).
CONFIG_COMPILER_OPT="-DWOLFSSL_NO_SOCK -DWOLFSSL_USER_IO -DNO_WOLFSSL_STUB"

# Main stack 24 KB on the ESP32 (32 KB on the other boards). The fast-curve25519 hybrid image did
# not fit DRAM by 6.6 KB at -O2 even with the 4 KB kernel heap below. The main thread runs the
# console and the timed ops: measured op stack peak <= 1.12 KB (P-521 derive, mem pass), plus
# console/printf, so 24 KB keeps a > 15 KB margin. Stack size does not affect timing. Same value
# in all four ESP32 images.
CONFIG_MAIN_STACK_SIZE=24576
# Kernel heap (k_malloc) 4 KB on the ESP32 (2026-11-10). The hybrid image puts ~200 KB of wolfCrypt
# code + tables into the ONE internal SRAM pool that IRAM and DRAM share. At -O2 (prj.conf
# CONFIG_SPEED_OPTIMIZATIONS, all boards) it overflowed DRAM by 7.4 KB even with 16 KB here.
# wolfSSL does NOT use this heap: its XMALLOC goes to libc malloc (COMMON_LIBC_MALLOC_ARENA_SIZE
# = 64 KB in prj.conf, unchanged and identical on every board; measured wolfSSL peak 18.9 KB).
# With networking off, only small driver allocations use k_malloc. Same value in all four
# ESP32 images (flash and hybrid).
CONFIG_HEAP_MEM_POOL_SIZE=4096

# --- W^X at boot (2026-11-10): our own PMS code (no Zephyr driver exists for it). Flash and
# hybrid images are both protected, like the Arm cores. Self-reports wx=pms.
CONFIG_PQC_WX=y
