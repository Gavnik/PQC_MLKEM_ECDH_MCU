# Pico 2 W -- RISC-V (Hazard3) core.  LAYER 1 ONLY.
#
# Zephyr's AIROC/CYW43 WiFi support for the RP2350 targets the Cortex-M33 core, so the
# Hazard3 build has NO networking and therefore NO Layer 2. This is a deliberate,
# documented scope boundary, not an omission: benchmarking the TLS handshake here would
# require a bare-metal RISC-V path, which would reintroduce the very OS confound that
# choosing Zephyr eliminates.
#
# Report it as a finding: "ML-KEM primitives were benchmarked on both RP2350 ISAs;
# TLS handshakes were ARM-only, as Zephyr's CYW43 WiFi support targets the Cortex-M33."

# --- explicitly NO networking on this target ---
CONFIG_WIFI=n
CONFIG_NETWORKING=n
CONFIG_NET_SOCKETS=n

# --- Layer 1 needs only crypto + console ---
# smaller stack than the ARM/WiFi build: no lwIP, no TLS session buffers
CONFIG_MAIN_STACK_SIZE=32768

# wolfSSL sees no networking on this Layer-1-only build. Define WOLFSSL_NO_SOCK on the
# COMMAND LINE (not just user_settings.h) so it is set before any wolfssl header is
# parsed -- avoids "implicit declaration of htons" from wolfio.h due to include ordering.
CONFIG_COMPILER_OPT="-DWOLFSSL_NO_SOCK -DWOLFSSL_USER_IO -DNO_WOLFSSL_STUB"

# --- USB-CDC console (Pico's own USB port becomes /dev/ttyACMx) ---
# The console/command channel goes over USB-CDC, not the UART GPIO pins. Requires the
# USB device stack + CDC-ACM, and the matching boards/<board>.overlay (chosen console).
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="PQC-Bench"
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
# wait for the USB CDC DTR (host opens the port) before printing, so we don't lose lines
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# --- W^X at boot (2026-11-10): our own locked PMP map (main.c). The RP2350 port enables no Zephyr
# PMP, and Zephyr's generic driver cannot express this policy on this core (erratum E6 breaks its
# no-execute background). Flash and hybrid images are both protected, like the Arm cores with
# Zephyr's MPU.
# The firmware self-reports wx=pmp when every entry is locked as planned.
CONFIG_PQC_WX=y
