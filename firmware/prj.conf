# prj.conf -- common Kconfig for the PQC KEM benchmark (all boards).
# Board-specific bits (WiFi driver, static IP) live in boards/<board>.conf overlays.
#
# IMPORTANT: wolfSSL's Zephyr module does NOT expose per-feature Kconfig symbols
# (no CONFIG_WOLFSSL_HASH_SHA256, etc). ALL crypto configuration -- ML-KEM, TLS 1.3,
# ECDSA, AES-GCM, SHA-2/3, curve25519 -- is done in src/user_settings.h, which the
# CMakeLists wires in via WOLFSSL_USER_SETTINGS. So this file only turns the module
# ON and configures the OS (console, heap, timing, networking).
#
# Kconfig rule learned the hard way: NO inline "# comment" on a value line -- Zephyr
# parses it as part of the value and aborts. Comments go on their own line only.

# ---------- console / command channel ----------
CONFIG_CONSOLE=y
# CONSOLE_SUBSYS + CONSOLE_GETLINE provide console_getline()/console_getline_init()
# that main.c uses for the blocking, newline-terminated command reader.
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETLINE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# ---------- C library / heap / stacks ----------
# The stats core prints doubles with %.4f. picolibc is the default libc on RP2350, and
# it needs its OWN float-printf switch. (We previously set NEWLIB_LIBC_FLOAT_PRINTF, but
# picolibc won the libc choice, so that newlib flag was ignored -> printed "*float*".)
# PICOLIBC_IO_FLOAT enables %f/%e/%g in printf/snprintf.
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
# ML-KEM + TLS need a generous main stack
CONFIG_MAIN_STACK_SIZE=32768
# HEAPS. wolfSSL allocates through libc malloc -> COMMON_LIBC_MALLOC_ARENA_SIZE (64 KB on every
# board; measured wolfSSL peak 18.9 KB, P-521 derive). HEAP_MEM_POOL_SIZE is the kernel k_malloc
# pool, not used by wolfSSL (the ESP32 L1 conf lowers it to 16 KB to fit the hybrid image).
# History: a hang once blamed on heap size was a key-object leak, fixed in the op functions
# (Free + re-Init of the ML-KEM key).
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536

# ---------- timing ----------
# Tick rate 1000 Hz (1 ms). Layer 1 does NOT mask interrupts across a timed op (masking wedged
# the USB-CDC console); the tick ISR is ~0.1% of an op and identical on every board.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# wolfSSL's wc_port.c (WOLFSSL_ZEPHYR path) tries an RTC device, then falls back to
# POSIX clock_gettime(). The Pico has no ready RTC node, so it hits the fallback.
# POSIX_TIMERS provides the clock_gettime IMPLEMENTATION; POSIX_API exposes its
# DECLARATION (prototype in <time.h>) so wc_port.c compiles. Need BOTH.
# (Keeping a real time source -- rather than NO_ASN_TIME -- keeps MCU wolfSSL behaviour
# aligned with the Pi build.)
# NOTE: if the build aborts with "undefined symbol POSIX_TIMERS", your Zephyr uses the
# older name: use CONFIG_POSIX_CLOCK=y instead of POSIX_TIMERS.
CONFIG_POSIX_API=y
CONFIG_POSIX_TIMERS=y



# ---------- console TX robustness (prevent USB-CDC wedge under output load) ----------
# Symptom: over a long run the board hung mid-print (e.g. "PROG roun"), and MORE output
# made it hang SOONER -> the USB-CDC console TX path was wedging when its buffer filled
# and printk blocked. Enable interrupt-driven UART with a generous TX ring buffer so
# printk never blocks waiting on a full CDC buffer.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_CONSOLE_MCUMGR=n
CONFIG_LOG=n
CONFIG_CBPRINTF_NANO=n

# ---------- watchdog: DISABLE for benchmarking ----------
# The RP2350 enables a hardware watchdog by default. It auto-resets the board if not
# "fed" within its timeout. Our long compute runs (1000 iters x 5 rounds of ML-KEM =
# ~28 s of near-continuous crypto) exceed that timeout and the board RESETS mid-run
# (observed: reboot banner, no output). We keep the watchdog DRIVER compiled in but tell
# Zephyr to actively DISABLE the hardware watchdog at boot -- this reliably turns off a
# HW watchdog that the bootloader/ROM may have started, which a bare CONFIG_WATCHDOG=n
# would not do. A benchmark has no use for a watchdog.
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=y

# ---------- entropy / RNG ----------
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=n

# ---------- wolfSSL (external module: modules/crypto/wolfssl) ----------
# Enable the module, build from its integrated sources, turn on ML-KEM via the
# module's own Kconfig, and point it at our settings file for the remaining options
# (TLS 1.3, ECDSA, AES-GCM, SHA-2/3, curve25519). The module adds
# ${APPLICATION_CONFIG_DIR}/src to the include path when SETTINGS_FILE is set, so the
# path below is relative to this app dir.
CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_BUILTIN=y
CONFIG_WOLFSSL_MLKEM=y
CONFIG_WOLFSSL_SETTINGS_FILE="src/user_settings.h"
# picolibc on these targets does NOT provide min()/max(), but the module otherwise
# injects -DWOLFSSL_HAVE_MIN/MAX (Zephyr >= 4.3), which tells wolfSSL to SKIP defining
# its own -> "implicit declaration of function 'min'" across many wolfcrypt sources.
# Setting this makes the module omit those defines so wolfSSL supplies min/max itself.
CONFIG_WOLFSSL_NO_HAVE_MIN_MAX=y

# ---------- drop mbedTLS everywhere (we use wolfSSL exclusively) ----------
# Zephyr links mbedTLS as its default TLS/crypto backend. We use wolfSSL for ALL crypto,
# so mbedTLS is dead weight (~50-70 KB) -- it must be disabled on every board (the Pico
# has even less RAM than the ESP32). We keep Zephyr's TLS-socket option OFF because our
# TLS is done directly through wolfSSL, not through Zephyr's mbedTLS-backed tls sockets.
CONFIG_MBEDTLS=n
CONFIG_NET_SOCKETS_SOCKOPT_TLS=n

# ---------- networking (Layer 2) ----------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=8

# Static IP (overridden per board in boards/*.conf)
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"


# ---------- mem mode: thread stack high-water measurement ----------
# INIT_STACKS paints thread stacks with a known pattern; THREAD_STACK_INFO exposes the
# stack bounds; together they let k_thread_stack_space_get() report unused bytes, from
# which we derive the peak stack used by one ML-KEM op (mirrors the Pi's painted-stack
# method). THREAD_MONITOR + THREAD_NAME help the analyzer.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y

# ---------- optimization level (EXPLICIT + identical across all boards) ----------
# SPLIT, the same on every board (2026-11-10):
#   wolfSSL (all 104 sources) + src/main.c (the timing harness) : -O2  (cmake/opt_split.cmake)
#   Zephyr kernel, drivers, libc                                : -Os  (this line, Zephyr default)
# -O2 for the crypto = what wolfSSL's own configure picks for SP math without SP_SMALL (our
# setup). Zephyr itself stays at its default -Os because the whole-image -O2 build of the RP2350
# Cortex-M33 does not enumerate on USB (bisected: fails at -O2 with the MPU off and with the stack
# guard off; boots with Zephyr at -Os and wolfSSL + main.c at -O2). The timed region is wolfSSL code
# + the harness, so the measured crypto is -O2 on every board. Self-reported as opt=split-O2.
CONFIG_SIZE_OPTIMIZATIONS=y
