# asm-OFF control (m33 AND m4): disable ALL wolfSSL Arm assembly so wolfSSL runs the SAME portable
# C that the Hazard3 (RISC-V) and ESP32 builds run. Self-reports asm=off. Apply LAST in EXTRA_CONF_FILE so it overrides the
# board conf's WOLFCRYPT_ARMASM=y. With this off:
#   - the Thumb-2 asm sources (thumb2-mlkem/curve25519/sha3/...) are NOT compiled  -> ML-KEM in C
#   - user_settings.h no longer defines WOLFSSL_SP_ARM_CORTEX_M_ASM (tied to WOLFCRYPT_ARMASM)
#     -> sp_cortexm.c's asm is compiled out, SP-ECC falls back to portable C -> ECDH in C
# m33-C vs m33-asm isolates the asm contribution; m33-C vs hz3-C (same chip) isolates the ISA.
CONFIG_WOLFCRYPT_ARMASM=n
CONFIG_WOLFCRYPT_ARMASM_THUMB2=n
