# Zephyr's MPU driver ON for a FLASH build. Needed on the Pico 2 m33, whose board default is off;
# the PSoC62 m4 board already has CONFIG_ARM_MPU=y and CONFIG_HW_STACK_PROTECTION=y by default.
# Goal: m33 and m4 run with the same protections in BOTH placements.
# On the RP2350 use together with overlay-rp2350-noflashcmd.conf (+ cmake/rp2350_time_critical.cmake).
CONFIG_ARM_MPU=y
CONFIG_HW_STACK_PROTECTION=y
