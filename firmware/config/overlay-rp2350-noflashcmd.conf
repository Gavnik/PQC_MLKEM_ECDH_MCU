# RP2350 (m33 + hz3): read the board ID from the CHIP (bootrom), not from the flash chip.
#
# The USB device stack (which selects HWINFO, so HWINFO itself cannot be turned off) reads the board
# ID at boot for its serial number. By default Zephyr's RP2350 hwinfo driver gets it with the Pico
# SDK's flash_get_unique_id(): that leaves XIP, sends a flash command, and re-enters XIP by EXECUTING
# a 256-byte copy of the boot2/XIP-setup routine kept in a plain static RAM array
# (pico-sdk hardware_flash/flash.c: boot2_copyout[], confirmed at pc 0x20007a54). Executing a
# writable data array is exactly what W^X forbids, so with Zephyr's MPU on it faults (IACCVIOL).
#
# HWINFO_RPI_PICO_CHIP_ID=y makes the driver use the bootrom's get_sys_info() instead (chip
# DEVICE_ID + WAFER_ID from OTP, the same ID the bootrom uses for its own USB serial). It runs from
# the bootrom region (read-only + executable in Zephyr's MPU map), touches no flash and no RAM code.
# Zephyr's help text recommends it for new RP2350 designs. Only the USB serial-number string
# changes (so the /dev/serial/by-id/ name of the Pico changes once).
# Our firmware never erases/programs flash, so no other path reaches boot2_copyout. (Future work:
# anything that writes flash would need that copy written once at boot, then locked R+X.)
CONFIG_HWINFO_RPI_PICO_CHIP_ID=y
