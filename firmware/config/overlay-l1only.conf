# Generic Layer-1-only overlay: turn networking OFF so a board without a working Zephyr
# WiFi/net driver (e.g. PSoC62 / CY8CPROTO-062-4343W, whose CYW4343W support is experimental)
# builds and runs the crypto benchmark. user_settings.h keys WOLFSSL_NO_SOCK on !CONFIG_NETWORKING,
# and main.c keeps all Layer-2/TLS code inside #if defined(CONFIG_NETWORKING), so this yields a
# clean L1-only image. Apply via EXTRA_CONF_FILE. Revisit networking per-board for Layer 2.
CONFIG_NETWORKING=n
CONFIG_NET_IPV4=n
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=n
CONFIG_NET_CONNECTION_MANAGER=n
CONFIG_NET_CONFIG_SETTINGS=n

# PARITY (2026-11-06): the same three L1-only wolfSSL flags the m33/hz3/lx7 L1 board confs pass,
# so the m4 compiles with an identical flag set. WOLFSSL_NO_SOCK + WOLFSSL_USER_IO were already set
# for the m4 via user_settings.h (!CONFIG_NETWORKING); the only new one is NO_WOLFSSL_STUB, which
# removes OpenSSL-compat stub functions (src/ssl_bn.c, pk.c, bio.c, ssl_crypto.c, wolfcrypt evp.c)
# -- none of them is on the ML-KEM / ECC / x25519 benchmark path.
CONFIG_COMPILER_OPT="-DWOLFSSL_NO_SOCK -DWOLFSSL_USER_IO -DNO_WOLFSSL_STUB"
