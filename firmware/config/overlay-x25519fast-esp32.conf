# ESP32-S3 ONLY: build the FAST curve25519 (fe_operations.c, 32-bit limbs) instead of the
# byte-wise CURVE25519_SMALL that wolfSSL's settings.h forces on every __xtensa__ target.
#
# Why wolfSSL forces SMALL on Xtensa (settings.h, verbatim): "Compilers for Xtensa have been seen
# to compile C code into non-constant time assembly code. The small implementation is not known to
# have these issues." + #warning "Contact wolfSSL support for a fast implementation that is
# constant time". => the fast path on Xtensa is NOT vouched constant-time by wolfSSL. We measure it
# as a PERFORMANCE reference only (fair cross-board cycle comparison), never as a deployable config.
#
# Requires the one-line guard patch in wolfssl/wolfcrypt/settings.h (see README, "One-time patches"):
#   #if defined(__xtensa__)   ->   #if defined(__xtensa__) && !defined(WOLFSSL_XTENSA_FAST_C25519)
# Without the patch this define does nothing (build still SMALL; SELFREPORT shows c25519=small).
#
# CONFIG_COMPILER_OPT is a single string that REPLACES the l1only board conf's value, so the three
# L1-only flags are repeated here. Put this overlay LAST in EXTRA_CONF_FILE.
CONFIG_COMPILER_OPT="-DWOLFSSL_NO_SOCK -DWOLFSSL_USER_IO -DNO_WOLFSSL_STUB -DWOLFSSL_XTENSA_FAST_C25519"
