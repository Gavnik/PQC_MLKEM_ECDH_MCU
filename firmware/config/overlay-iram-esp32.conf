# ESP32-S3 HYBRID placement (the ESP32 counterpart of overlay-hyb-arm.conf / overlay-hyb-rv.conf).
# The ESP32 port has no CODE_DATA_RELOCATION, so tools/esp32_iram_patch.py writes the SAME object
# list as cmake/hyb_relocate.cmake into soc/espressif/esp32s3/default.ld, guarded by this symbol:
#   wolfCrypt code (.literal/.text) -> IRAM  (.iram0.text, _pqc_code_start/_end)
#   wolfCrypt constants (.rodata)    -> DRAM  (.dram0.data, _pqc_tables_start/_end, 256-B aligned)
# Protection (CONFIG_PQC_WX, ESP32 board conf): IRAM R+X, tables block R only (PMS DRAM split lines
# D_0/D_1), rest of DRAM R+W, no execute. Self-reports placement=hybrid.
# Use with boards/esp32s3_devkitc_procpu_l1only.conf (+ overlay-x25519fast-esp32.conf for the fast
# curve25519 image). Run tools/esp32_iram_patch.py --build <an ESP32 build dir> once beforehand.
CONFIG_PQC_CRYPTO_IN_IRAM=y
