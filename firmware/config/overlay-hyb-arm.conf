# HYBRID placement, Cortex-M (m33 AND m4 -- identical on both). Use with cmake/hyb_relocate.cmake.
# Crypto code + constant tables are copied flash->SRAM at boot; everything else runs from flash.
#
# Zephyr's MPU driver stays ON with its normal protections (flash read-only, SRAM execute-never,
# stack overflow protection). Three-way W^X in SRAM, all from Zephyr's own static MPU regions:
#   crypto CODE block   read-only + executable  (CODE_DATA_RELOCATION_SRAM: arm_core_mpu.c, stock)
#   crypto TABLES block read-only, no-execute   (tools/zephyr_tables_ro_patch.py adds this entry)
#   rest of SRAM        read/write, no-execute  (stock)
CONFIG_CODE_DATA_RELOCATION_SRAM=y
CONFIG_ARM_MPU=y
CONFIG_HW_STACK_PROTECTION=y
